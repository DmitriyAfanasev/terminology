[project]
name = "terminology"
version = "1.0.0"
description = "Сервис терминологии: справочники, версии, элементы. Django 6 + DRF (sync)."
requires-python = ">=3.12"
dependencies = [
    "django>=6.0,<6.2",
    "djangorestframework>=3.15",
    "djangorestframework-stubs>=3.18.1",
    "drf-spectacular>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4.9",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "DJ", "RUF", "PT"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # кириллица в строках/комментариях — намеренно
    "RUF012",                      # изменяемые атрибуты класса в Django Meta/Admin
    "DJ001",
]

[tool.ruff.lint.per-file-ignores]
"config/settings.py" = ["E501"]
"tests/refbooks_tests/*" = ["E501"]
"refbooks/management/commands/seed_demo.py" = ["E501"]
